<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - Dormitory MS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="bi bi-building-check"></i>
        <span>Dormitory MS</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button id="theme-toggle-btn" class="btn btn-sm btn-secondary-custom">
          <i id="theme-toggle-icon" class="bi bi-moon-stars-fill text-primary"></i>
          <span id="theme-toggle-text" class="d-none d-md-inline">โหมดมืด</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Error Container -->
  <div class="container my-auto py-5 text-center">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card card-custom p-5 shadow-sm">
          <div class="stat-icon bg-danger-subtle text-danger mx-auto mb-3" style="width: 70px; height: 70px;">
            <i class="bi bi-shield-x fs-1"></i>
          </div>
          <h2 class="fw-bold mb-2">{{.Title}}</h2>
          <p class="text-secondary mb-4">{{.Message}}</p>
          <div>
            <a href="/" class="btn btn-primary-custom px-4 me-2">
              <i class="bi bi-house-door me-1"></i> กลับหน้าหลัก
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary-custom px-4">
              <i class="bi bi-arrow-left me-1"></i> ย้อนกลับ
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center">
      <p class="mb-0 small text-secondary">Dormitory Management System &bull; Go + PostgreSQL</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/theme.js"></script>
</body>
</html>
